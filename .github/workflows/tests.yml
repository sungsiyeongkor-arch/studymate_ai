name: StudyMate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studymate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pytest -q
      - name: PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/studymate_test
        run: python -m pytest -q
      - name: Migration upgrade and drift check
        run: |
          flask --app app db upgrade
          flask --app app db check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find studymate/static -name '*.js' -exec node --check {} \;
